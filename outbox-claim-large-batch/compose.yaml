name: outbox-claim-repro

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: outbox_repro
    ports:
      - '127.0.0.1:53308:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-proot']
      interval: 2s
      timeout: 3s
      retries: 60

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: outbox_repro
    ports:
      - '127.0.0.1:55438:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d outbox_repro']
      interval: 2s
      timeout: 3s
      retries: 60
